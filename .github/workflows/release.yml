name: Release Python SOCKS5 Library

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -e ".[aiogram,legacy,dev]"
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Build distributions
        run: python -m build
      - name: Attach wheel and source distribution to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag

