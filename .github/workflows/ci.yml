name: Library CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and test dependencies
        run: python -m pip install -e ".[aiogram,dev]"
      - name: Test core and runtime
        run: python -m unittest discover -s tests -q
      - name: Build wheel and sdist
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker image
        run: docker build -t tgws-botapi:ci .
      - name: Check runtime entrypoint
        run: docker run --rm tgws-botapi:ci --help
