[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tgws-botapi"
version = "0.1.0"

description = "Headless Telegram Bot API runtime using Flowseal's MTProto WebSocket bridge"
readme = "README.md"
requires-python = ">=3.10"

license = "MIT"

authors = [{ name = "AegisRed" }, { name = "Flowseal" }]

keywords = [
    "telegram",
    "aiogram",
    "bot-api",
    "proxy",
    "bypass",
    "websocket",
    "mtproto",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = ["certifi", "cryptography>=41,<47", "httpx[http2]>=0.28,<0.29"]

[project.optional-dependencies]
aiogram = ["aiogram>=3.0,<4"]
dev = ["build>=1.2", "ruff>=0.9"]

[project.scripts]
tgws-botapi = "tgws_botapi.cli:main"
tgws-mtproto = "proxy.tg_ws_proxy:main"

[project.urls]
Source = "https://github.com/AegisRed/tg-ws-proxy-aiogram"
Issues = "https://github.com/AegisRed/tg-ws-proxy-aiogram/issues"
Upstream = "https://github.com/Flowseal/tg-ws-proxy"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "tgws_botapi"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]
